[project]
name = "langgraph-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "farhheenkhan254-fk", email = "farhheenkhan254@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=1.8.3",
    "langgraph>=1.2.23",
    "langsmith>=0.15.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
langgraph = "langgraph:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[tool.uv]
package = false
